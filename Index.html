<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Cake Surprise 🎂</title>

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- MUSIC -->
  <audio id="bgMusic" loop>
    <source src="music/song.mp3" type="audio/mp3">
  </audio>

  <!-- SCREEN 1 -->
  <section id="cakeScreen" class="screen active">

    <h1 class="title">
      Cake katte hole permission lagbe 😼
    </h1>

    <img src="images/cake.png" class="cake">

    <img src="images/knife.png" class="knife">

    <button id="cutCakeBtn">
      Cake Kati 😎
    </button>

  </section>

  <!-- SCREEN 2 -->
  <section id="funnyScreen" class="screen">

    <h1 class="funnyText">
      NAHHH ETO SOJA NAAA 😭
    </h1>

    <p class="smallText">
      Age puzzle solve korte hobe 😼
    </p>

    <div class="btnGroup">

      <button id="solveBtn">
        Solve Puzzle 🧩
      </button>

      <button id="skipBtn">
        Skip 🙂
      </button>

    </div>

  </section>

  <!-- MONKEY POPUP -->
  <div id="monkeyPopup">

    <img src="images/monkey.png" class="monkey">

    <h2>
      Nahhh eto soja na bador 🐒
    </h2>

  </div>

  <!-- SCREEN 3 -->
  <section id="puzzleScreen" class="screen">

    <h1 class="puzzleTitle">
      IQ Test Start 😼
    </h1>

    <div class="puzzleGrid">

      <div class="piece">1</div>
      <div class="piece">2</div>
      <div class="piece">3</div>

      <div class="piece">4</div>
      <div class="piece">5</div>
      <div class="piece">6</div>

      <div class="piece">7</div>
      <div class="piece">8</div>
      <div class="piece empty"></div>

    </div>

    <button id="completePuzzle">
      Puzzle Solve Hoye Gese 😎
    </button>

  </section>

  <!-- SCREEN 4 -->
  <section id="galleryScreen" class="screen">

    <h1 class="galleryTitle">
      Ebar Cake Pabi 😌🍰
    </h1>

    <div class="gallery">

      <img src="images/photo1.jpg">
      <img src="images/photo2.jpg">

      <img src="images/photo3.jpg">
      <img src="images/photo4.jpg">

      <img src="images/photo5.jpg">
      <img src="images/photo6.jpg">

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
