<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Cake 🎂</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MUSIC -->
  <audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mp3">
  </audio>

  <!-- KNIFE CURSOR -->
  <img src="knife.png" id="knifeCursor">

  <!-- CAKE SCREEN -->
  <section id="cakeScreen" class="screen active">

    <div class="cakeContainer">

      <img src="cake.png" id="cake">

    </div>

  </section>

  <!-- FUNNY SCREEN -->
  <section id="funnyScreen" class="screen">

    <div class="btnGroup">

      <button id="solveBtn">
        Solve Puzzle 🧩
      </button>

      <button id="skipBtn">
        Skip 🙂
      </button>

    </div>

  </section>

  <!-- MONKEY POPUP -->
  <div id="monkeyPopup">

    <img src="monkey.jpg" class="monkey">

  </div>

  <!-- PUZZLE SCREEN -->
  <section id="puzzleScreen" class="screen">

    <div class="puzzleImageBox">

      <img src="photo1.jpg" class="puzzleImage">

    </div>

    <button id="completePuzzle">
      Complete 😎
    </button>

  </section>

  <!-- FINAL CAKE -->
  <section id="finalCakeScreen" class="screen">

    <div class="cakeContainer">

      <img src="cake.png" id="finalCake">

    </div>

  </section>

  <!-- FINAL SCREEN -->
  <section id="birthdayScreen" class="screen">

    <div class="sparkles"></div>

    <h1 class="birthdayText">
      HAPPY BIRTHDAY 🎉
    </h1>

    <div class="gallery">

      <img src="photo1.jpg">
      <img src="photo2.jpg">
      <img src="photo3.jpg">
      <img src="photo4.jpg">

    </div>

  </section>

  <script src="script.js"></script>

</body>

</html>
