<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise 🎂</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<audio id="bgMusic" loop>

<source src="song.mp3"
type="audio/mp3">

</audio>

<div class="petals"></div>

<!-- FIRST SCREEN -->

<section id="cakeScreen"
class="screen active">

<h1 class="mainText">
Jonmodine cake katte hobe je 🎂
</h1>

<p class="instruction">
Knife ta dhore cake er upor swipe koro 😭
</p>

<div class="cakeArea">

<img src="cake.png"
id="cake">

<div class="cakeCrack"></div>

<img src="knife.png"
id="dragKnife">

</div>

</section>

<!-- FUNNY SCREEN -->

<section id="funnyScreen"
class="screen">

<h1 class="funnyTitle">
Age eta solve kor 😭
</h1>

<div class="btnGroup">

<button id="solveBtn">
Solve Puzzle 🧩
</button>

<button id="skipBtn">
Skip 🙂
</button>

</div>

</section>

<!-- MONKEY -->

<div id="monkeyPopup">

<img src="monkey.jpg"
class="monkey">

<div class="popupText">
Eto soja na 😭
</div>

</div>

<!-- PUZZLE -->

<section id="puzzleScreen"
class="screen">

<h1 class="puzzleText">
Puzzle Solve Koro 😭
</h1>

<div class="puzzleGrid"></div>

<button id="completePuzzle">
Complete 😎
</button>

</section>

<!-- FINAL CAKE -->

<section id="finalCakeScreen"
class="screen">

<h1 class="mainText">
Ebar Cake Kato 😭
</h1>

<div class="cakeArea">

<img src="cake.png"
id="finalCake">

<div class="cakeCrack"></div>

<img src="knife.png"
id="dragKnifeFinal">

</div>

</section>

<!-- FINAL -->

<section id="birthdayScreen"
class="screen">

<div class="sparkles"></div>

<h1 class="birthdayText">
Happy Birthday 🎉
</h1>

<div class="carousel">

<div class="carouselTrack">

<img src="photo1.jpg">
