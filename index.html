<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Birthday Surprise 🎂</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- MUSIC -->
  <audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mp3">
  </audio>

  <!-- KNIFE CURSOR -->
  <img src="knife.png" id="knifeCursor">

  <!-- SCREEN 1 -->
  <section id="cakeScreen" class="screen active">

    <h1 class="title">
      Cake katte hole permission lagbe 😼
    </h1>

    <p class="subtitle">
      Right click kore swipe koro 🎂
    </p>

    <div class="cakeContainer">

      <img src="cake.png" id="cake">

    </div>

  </section>

  <!-- SCREEN 2 -->
  <section id="funnyScreen" class="screen">

    <h1 class="funnyText">
      NAHHH ETO SOJA NAAA 😭
    </h1>

    <p class="subtitle">
      Age puzzle solve korte hobe 😼
    </p>

    <div class="btnGroup">

      <button id="solveBtn">
        Solve Puzzle 🧩
      </button>

      <button id="skipBtn">
        Skip 🙂
      </button>

    </div>

  </section>

  <!-- MONKEY POPUP -->
  <div id="monkeyPopup">

    <img src="monkey.jpg" class="monkey">

    <h2>
      Nahhh eto soja na bador 🐒
    </h2>

  </div>

  <!-- SCREEN 3 -->
  <section id="puzzleScreen" class="screen">

    <h1 class="title">
      IQ Test Start 😼
    </h1>

    <p class="subtitle">
      Puzzle ta match koro 😭
    </p>

    <div class="puzzleImageBox">

      <img src="photo1.jpg" class="puzzleImage">

    </div>

    <button id="completePuzzle">
      Puzzle Solve Hoye Gese 😎
    </button>

  </section>

  <!-- SCREEN 4 -->
  <section id="finalCakeScreen" class="screen">

    <h1 class="title">
      Ebar Cake Kato 😌🍰
    </h1>

    <p class="subtitle">
      Swipe koro 🎂
    </p>

    <div class="cakeSplitContainer">

      <img src="cake.png" id="finalCake">

    </div>

  </section>

  <!-- SCREEN 5 -->
  <section id="birthdayScreen" class="screen">

    <div class="sparkles"></div>

    <h1 class="birthdayText">
      HAPPY BIRTHDAY 🎉
    </h1>

    <div class="gallery">

      <img src="photo1.jpg">
      <img src="photo2.jpg">
      <img src="photo3.jpg">
      <img src="photo4.jpg">

    </div>

  </section>

  <script src="script.js"></script>

</body>

</html>
