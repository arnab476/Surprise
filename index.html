<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Surprise 🎂</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MUSIC -->
  <audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mp3">
  </audio>

  <!-- KNIFE -->
  <img src="knife.png" id="knifeCursor">

  <!-- SCREEN 1 -->
  <section id="cakeScreen" class="screen active">

    <h1 class="mainText">
      Jonmodine cake katte hobe je 🎂
    </h1>

    <p class="instruction">
      Right swipe korle cake katbe 😼
    </p>

    <img src="cake.png" id="cake">

  </section>

  <!-- SCREEN 2 -->
  <section id="funnyScreen" class="screen">

    <h1 class="funnyTitle">
      Age eta solve kor 😭
    </h1>

    <div class="btnGroup">

      <button id="solveBtn">
        Solve Puzzle 🧩
      </button>

      <button id="skipBtn">
        Skip 🙂
      </button>

    </div>

  </section>

  <!-- POPUP -->
  <div id="monkeyPopup"></div>

  <!-- PUZZLE -->
  <section id="puzzleScreen" class="screen">

    <h1 class="puzzleText">
      Puzzle Solve Koro 😭
    </h1>

    <div class="puzzleGrid"></div>

    <button id="completePuzzle">
      Complete 😎
    </button>

  </section>

  <!-- FINAL CAKE -->
  <section id="finalCakeScreen" class="screen">

    <h1 class="mainText">
      Ebar Cake Kato 😌
    </h1>

    <p class="instruction">
      Swipe swipe 😭
    </p>

    <img src="cake.png" id="finalCake">

  </section>

  <!-- FINAL -->
  <section id="birthdayScreen" class="screen">

    <div class="sparkles"></div>

    <h1 class="birthdayText">
      HAPPY BIRTHDAY 🎉
    </h1>

    <div class="gallery">

      <img src="photo1.jpg">
      <img src="photo2.jpg">
      <img src="photo3.jpg">
      <img src="photo4.jpg">

    </div>

  </section>

  <script src="script.js"></script>

</body>

</html>
